[project]
name = "trustme-ralio-backend"
version = "0.1.0"
description = "TrustMe multi-agent finance operations backend using PydanticAI and Ralio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ralio" },
]
keywords = [
    "agent",
    "finance",
    "fastapi",
    "pydantic-ai",
    "ralio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.12",
    "openai>=1.30",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Ralioco/ralio-client-agent"
Repository = "https://github.com/Ralioco/ralio-client-agent"
Issues = "https://github.com/Ralioco/ralio-client-agent/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]
