[project]
name = "hackathon-minimal-cli-agent"
version = "0.1.0"
description = "Minimal CLI-driven agent starter for connecting to Ralio."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]
